<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 750px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 160px;

            resize: none;

            padding: 15px;

            border: 1px solid #ccc;
            border-radius: 10px;

            font-size: 16px;
        }

        button {
            width: 100%;

            margin-top: 15px;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #222;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #result {
            margin-top: 30px;

            display: none;
        }

        .prediction {
            text-align: center;

            font-size: 28px;
            font-weight: bold;

            margin-bottom: 25px;
        }

        .confidence {
            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }

        .bar-container {
            margin-bottom: 18px;
        }

        .label {
            display: flex;
            justify-content: space-between;

            margin-bottom: 6px;

            font-size: 14px;
        }

        .bar {
            height: 12px;

            background: #e5e5e5;

            border-radius: 10px;

            overflow: hidden;
        }

        .fill {
            height: 100%;

            width: 0%;

            background: #222;

            transition: width 0.5s;
        }

        .comparison {
            margin-top: 30px;

            padding-top: 20px;

            border-top: 1px solid #ddd;
        }

        .comparison h3 {
            margin-bottom: 15px;
        }

        .comparison p {
            margin-bottom: 8px;
        }

        .error {
            margin-top: 20px;

            color: #c00;

            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sentiment Analyzer</h1>

    <p class="subtitle">
        Analyze text using TF-IDF and machine learning models
    </p>

    <textarea
        id="text"
        placeholder="Enter a review, tweet, or any text..."
    ></textarea>

    <button onclick="analyzeSentiment()">
        Analyze Sentiment
    </button>

    <div id="error" class="error"></div>

    <div id="result">

        <div id="prediction" class="prediction"></div>

        <div id="confidence" class="confidence"></div>

        <div class="bar-container">

            <div class="label">
                <span>Negative</span>
                <span id="negative-value">0%</span>
            </div>

            <div class="bar">
                <div
                    id="negative-bar"
                    class="fill"
                ></div>
            </div>

        </div>


        <div class="bar-container">

            <div class="label">
                <span>Neutral</span>
                <span id="neutral-value">0%</span>
            </div>

            <div class="bar">
                <div
                    id="neutral-bar"
                    class="fill"
                ></div>
            </div>

        </div>


        <div class="bar-container">

            <div class="label">
                <span>Positive</span>
                <span id="positive-value">0%</span>
            </div>

            <div class="bar">
                <div
                    id="positive-bar"
                    class="fill"
                ></div>
            </div>

        </div>


        <div class="comparison">

            <h3>Model Comparison</h3>

            <p>
                SVM:
                <strong id="svm-result"></strong>
            </p>

            <p>
                Ensemble:
                <strong id="ensemble-result"></strong>
            </p>

        </div>

    </div>

</div>


<script>

async function analyzeSentiment() {

    const text = document
        .getElementById("text")
        .value
        .trim();

    const result = document
        .getElementById("result");

    const error = document
        .getElementById("error");


    if (!text) {

        error.textContent =
            "Please enter some text.";

        result.style.display = "none";

        return;
    }


    error.textContent = "";


    try {

        const response = await fetch(
            "/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    text: text
                })
            }
        );


        if (!response.ok) {

            throw new Error(
                "Prediction failed."
            );
        }


        const data =
            await response.json();


        const prediction =
            data.svm_prediction;


        const probabilities =
            data.svm_probabilities;


        const confidence =
            probabilities[prediction] * 100;


        document.getElementById(
            "prediction"
        ).textContent =
            prediction;


        document.getElementById(
            "confidence"
        ).textContent =
            `Confidence: ${confidence.toFixed(2)}%`;


        updateBar(
            "negative",
            probabilities.Negative
        );

        updateBar(
            "neutral",
            probabilities.Neutral
        );

        updateBar(
            "positive",
            probabilities.Positive
        );


        document.getElementById(
            "svm-result"
        ).textContent =
            data.svm_prediction;


        document.getElementById(
            "ensemble-result"
        ).textContent =
            data.ensemble_prediction;


        result.style.display = "block";

    }

    catch (err) {

        error.textContent =
            "Something went wrong. Make sure the API is running.";

        result.style.display = "none";

    }

}


function updateBar(label, value) {

    const percentage =
        value * 100;


    document.getElementById(
        `${label}-value`
    ).textContent =
        `${percentage.toFixed(2)}%`;


    document.getElementById(
        `${label}-bar`
    ).style.width =
        `${percentage}%`;

}

</script>

</body>

</html>
